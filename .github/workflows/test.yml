name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install
        run: uv sync --extra dev --python ${{ matrix.python }}

      - name: Lint
        run: uv run ruff check sillo_vise tests

      - name: Format
        run: uv run ruff format --check sillo_vise tests

      - name: Types
        run: uv run mypy sillo_vise

      - name: Test
        run: uv run pytest -q

  # The interface is committed into the package, which is what lets a wheel
  # install with no node. That only stays true if the committed build matches
  # the source — so this rebuilds it and fails when the two have drifted.
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile
        working-directory: ui

      - name: Build
        run: bun run build
        working-directory: ui

      - name: The committed build must match the source
        run: |
          if ! git diff --quiet -- sillo_vise/dashboard/static; then
            echo "The built interface differs from what is committed."
            echo "Run: cd ui && bun run build, then commit the result."
            git diff --stat -- sillo_vise/dashboard/static
            exit 1
          fi
